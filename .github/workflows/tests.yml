---
name: Tests
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  db:
    name: db (postgres ${{ matrix.postgres }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '14'
          - '16'
          - '17'
        resolution:
          - locked
        include:
          # The floor of every declared dependency range, so a too-low
          # lower bound fails here instead of in a consumer's environment.
          - postgres: '16'
            resolution: lowest-direct
    env:
      MINT_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Use https for git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf \
            "ssh://git@github.com/"
      - name: Install locked dependencies
        if: matrix.resolution == 'locked'
        run: uv sync --all-extras --all-groups --all-packages
      - name: Install lowest declared dependencies
        if: matrix.resolution == 'lowest-direct'
        # Pinned to the oldest supported Python: the oldest driver releases
        # ship no wheels for newer interpreters.
        run: |
          uv sync --all-extras --all-groups --all-packages \
            --python 3.13 --resolution lowest-direct
      - name: Concurrency regression suite
        run: uv run --no-sync python -m pytest -m concurrency tests/db
      - name: DB tests with coverage gate
        run: |
          uv run --no-sync python -m pytest tests/db \
            --cov=mint.db --cov-report=term-missing --cov-fail-under=100
  full:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Use https for git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf \
            "ssh://git@github.com/"
      - name: Install dependencies
        run: uv sync --all-extras --all-groups --all-packages
      - name: Run tests
        run: uv run --no-sync python -m pytest tests
